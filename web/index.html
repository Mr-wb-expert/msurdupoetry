<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b1a17" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Mujahid Sajjad — Urdu Poet &amp; Writer</title>
    <meta
      name="description"
      content="Books by Mujahid Sajjad, Urdu poet and writer. Read every book online or download the PDF, free."
    />

    <!-- This is a single-page app, so the crawlers that execute JavaScript are
         the ones that will see any content. Named explicitly so the engines
         that can run it are invited to, rather than left to guess. -->
    <meta name="googlebot" content="indexable, follow" />

    <!-- Base Open Graph tags: the client rewrites them per page, but a
         crawler that does not run JavaScript still gets a preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mujahid Sajjad" />
    <meta property="og:title" content="Mujahid Sajjad — Urdu Poet &amp; Writer" />
    <meta
      property="og:description"
      content="Books by Mujahid Sajjad, Urdu poet and writer. Read every book online or download the PDF, free."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mujahid Sajjad",
        "jobTitle": "Urdu poet, writer and Associate Professor of English",
        "worksFor": {
          "@type": "CollegeOrUniversity",
          "name": "Govt. Graduate College Burewala"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 2rem; max-width: 40rem; margin: 0 auto">
        This site needs JavaScript to browse the library. Every book is also
        available as a free PDF — please
        <a href="https://wa.me/923006993551">message on WhatsApp</a> and we will send the link.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
